    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Public Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--gradient);
      padding: 0 48px; height: 66px;
      display: flex; align-items: center; gap: 20px;
    }
    .logo { flex: 1; }
    .logo img { height: 22px; display: block; }
    nav { display: flex; gap: 8px; }
    nav button {
      position: relative; overflow: hidden;
      font-family: inherit; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.6px;
      padding: 10px 24px; border-radius: 999px;
      border: 1px solid rgba(245,245,242,0.35);
      background: rgba(245,245,242,0.12);
      /* fallback simples primeiro (Safari não segue bem filtros SVG aqui);
         a versão com distorção de vidro fica só para quem a suportar */
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      backdrop-filter: blur(10px) saturate(160%);
      backdrop-filter: url(#glass-distortion) blur(6px) saturate(160%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 4px 14px rgba(0,0,0,0.18);
      color: #f5f5f2;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    /* grão subtil por cima do vidro — mesma textura reutilizada em todos os
       botões "de vidro" do site via var(--noise) */
    nav button::before {
      content: ''; position: absolute; inset: 0;
      background-image: var(--noise); background-size: 100px 100px;
      opacity: 0.05; mix-blend-mode: overlay; pointer-events: none;
    }
    nav button:hover  { background: rgba(245,245,242,0.22); }
    nav button.active {
      background: var(--acc); color: var(--header-bg); border-color: var(--acc);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 4px 14px rgba(0,0,0,0.18);
    }

    /* ── DATE BAR ── */
    .date-bar {
      background: var(--surf); border-bottom: 1px solid var(--line);
      width: 100%;
      display: flex;
      position: sticky;
      top: 66px;
      z-index: 99;
    }
    .date-indicator {
      position: absolute; inset: 0;
      background: var(--gradient);
      clip-path: inset(0 100% 0 0);
      pointer-events: none;
      z-index: 0;
    }
    /* Traços entre dias — só existem para separar no branco por preencher;
       ficam por baixo do preenchimento (clip inverso ao da faixa), por isso
       desaparecem naturalmente à medida que o gradiente os cobre. */
    .date-dividers {
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(to right,
        var(--line), var(--line) 1px, transparent 1px, transparent calc(100% / 12));
      clip-path: inset(0 0 0 0);
      pointer-events: none;
      z-index: 0;
    }
    /* O fundo é sempre transparente — é a faixa (.date-indicator) por baixo
       que pinta, contínua, sem interrupções por chip. */
    .date-chip {
      position: relative; z-index: 1;
      flex: 1;
      font-family: inherit; background: transparent; border: none;
      padding: 22px 0; text-align: center;
      cursor: pointer; transition: background 0.15s;
      color: var(--ink2);
    }
    /* .filled = já coberto pelo preenchimento; .current = o dia selecionado,
       mesmo que o preenchimento ainda não lá tenha chegado (senão não havia
       nenhum sinal de qual é o dia atual logo a seguir a um clique/salto). */
    .date-chip.filled, .date-chip.current { color: var(--acc); text-shadow: 0 1px 2px rgba(0,0,0,0.35); }
    /* hover não pode ser opaco — tapava a faixa do gradiente por baixo */
    .date-chip:hover { background: rgba(0,0,0,0.08); }
    .date-chip .dn { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.55; margin-bottom: 8px; }
    .date-chip .dd { display: block; font-size: 32px; font-weight: 800; line-height: 1; }
    .date-chip .dm { display: none; }

    /* ── HEADER CONTROLS (idioma + cidade, agora dentro do banner) ── */
    .header-controls { display: flex; align-items: center; gap: 10px; }
    .micro-toggle {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      border-radius: 10px;
      border: 1px solid rgba(245,245,242,0.35);
      background: rgba(245,245,242,0.12);
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      backdrop-filter: blur(10px) saturate(160%);
      backdrop-filter: url(#glass-distortion) blur(6px) saturate(160%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 14px rgba(0,0,0,0.15);
    }
    .micro-toggle::before {
      content: ''; position: absolute; inset: 0;
      background-image: var(--noise); background-size: 100px 100px;
      opacity: 0.05; mix-blend-mode: overlay; pointer-events: none;
    }
    .mt-opt {
      position: relative; z-index: 1;
      font-family: inherit; font-size: 10px; font-weight: 800;
      letter-spacing: 0.8px; text-transform: uppercase;
      padding: 4px 14px; border: none; background: none;
      color: rgba(245,245,242,0.5);
      cursor: pointer; line-height: 1.6;
      transition: color 0.15s;
    }
    .mt-opt.active { color: var(--acc); }
    .mt-opt:hover:not(.active) { color: rgba(245,245,242,0.85); }

    /* ── MAIN ── */
    main { padding: 0 48px 100px; max-width: 1200px; margin: 0 auto; }

    /* ── AGENDA ── */
    .agenda-day { scroll-margin-top: 170px; }
    @media (max-width: 720px) { .agenda-day { scroll-margin-top: 130px; } }

    .day-header {
      display: flex; align-items: baseline; gap: 14px;
      padding: 28px 0 18px;
      border-bottom: 2px solid var(--ink);
    }
    .day-header .dname { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
    .day-header .ddate { font-size: 22px; font-weight: 400; color: var(--ink2); }
    .day-header .dcount { font-size: 12px; color: var(--ink3); margin-left: auto; font-weight: 500; }

    .sessions-list { display: flex; flex-direction: column; }

    .session-row {
      display: grid;
      grid-template-columns: 90px 96px 1fr auto;
      align-items: center;
      gap: 40px;
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .session-row:hover { opacity: 0.5; }

    .stime {
      font-size: 38px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px; line-height: 1;
    }
    .sthumb {
      width: 84px; height: 116px; border-radius: 0;
      object-fit: cover; display: block; flex-shrink: 0;
      background: var(--surf2);
    }
    .smovie { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .stitle  { font-size: 22px; font-weight: 700; line-height: 1.2; }
    .smeta   { font-size: 13px; color: var(--ink2); }

    .scinema {
      font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px;
      white-space: nowrap;
    }

    /* ── FILMES ── */
    .films-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 0 20px; border-bottom: 2px solid var(--ink);
    }
    .films-header-title { font-size: 22px; font-weight: 800; }
    .films-sort { display: flex; gap: 6px; }
    .sort-btn {
      font-family: inherit; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      padding: 8px 18px; border-radius: 0;
      border: 1.5px solid var(--line); background: none; color: var(--ink2);
      cursor: pointer; transition: all 0.15s;
    }
    .sort-btn:hover { color: var(--ink); border-color: var(--ink3); }
    .sort-btn.active { background: var(--ink); border-color: var(--ink); color: var(--acc); }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1px; background: var(--line);
      border: 1px solid var(--line);
      margin-top: 2px;
    }
    .movie-card { cursor: pointer; background: var(--surf); overflow: hidden; }
    .movie-card:hover .poster-bg { transform: scale(1.04); }

    .movie-poster { aspect-ratio: 2/3; overflow: hidden; position: relative; }
    .poster-bg {
      width: 100%; height: 100%;
      transition: transform 0.4s ease;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 14px;
    }
    .poster-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.08) 55%, transparent 100%);
    }
    .poster-title {
      position: relative; z-index: 1;
      font-size: 13px; font-weight: 700; line-height: 1.3; color: rgba(255,255,255,0.5);
    }
    .poster-dir {
      position: relative; z-index: 1;
      font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px;
    }
    .poster-rating {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      font-size: 10px; font-weight: 800;
      background: var(--acc); color: #000;
      padding: 3px 8px; border-radius: 0;
    }
    .movie-foot {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
    }
    .film-foot-title { font-size: 13px; font-weight: 700; margin-bottom: 3px; line-height: 1.3; }
    .film-foot-dir   { font-size: 11px; color: var(--ink2); margin-bottom: 8px; }
    .genres { display: flex; gap: 4px; flex-wrap: wrap; }
    .genre-tag {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;
      padding: 3px 8px; border-radius: 0;
      border: 1px solid var(--line); color: var(--ink3);
    }
    .special-tag {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800;
      padding: 3px 9px; border-radius: 0;
      background: var(--acc); color: #000;
    }
    .session-labels { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }

    /* ── MODAL (dark / cinematic) ── */
    .modal-overlay {

      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: #0f0f0f; color: #f0f0f0;
      border-radius: 0; width: 100%; max-width: 780px; max-height: 92vh;
      overflow-y: auto; display: flex; flex-direction: column;
      transform: translateY(22px); transition: transform 0.25s cubic-bezier(.22,1,.36,1);

    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-top { display: flex; gap: 32px; padding: 32px 32px 24px; }
    .modal-poster {
      flex-shrink: 0; width: 175px; aspect-ratio: 2/3;

    .modal-poster-fallback { width: 100%; height: 100%; }

    .modal-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

    .modal-close  {
      flex-shrink: 0; width: 32px; height: 32px;
      border: 1.5px solid #2a2a2a; border-radius: 0; background: none; cursor: pointer;
      font-size: 16px; color: #555;
      display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s;

    .modal-close:hover { border-color: #555; color: #fff; }

    .modal-meta { font-size: 13px; color: #777; }

    .modal-genres { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }

<!-- Recreação do efeito "Liquid Glass" via filtro SVG (feTurbulence +
     feDisplacementMap + feSpecularLighting), aplicado via backdrop-filter
     nos botões de vidro. Não tem representação visual própria. -->
<svg xmlns="http://www.w3.org/2000/svg" role="presentation" style="display: none">
  <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.001 0.005" numOctaves="1" seed="17" result="turbulence"/>
    <feComponentTransfer in="turbulence" result="mapped">
      <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
      <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
      <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
    </feComponentTransfer>
    <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
    <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100" lighting-color="white" result="specLight">
      <fePointLight x="-200" y="-200" z="300" />
    </feSpecularLighting>
    <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />
    <feDisplacementMap in="SourceGraphic" in2="softMap" scale="200" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

  batalha:    'linear-gradient(135deg,#1a1000 0%,#2e1c00 100%)',
  trindade:   'linear-gradient(135deg,#1a0010 0%,#2e0018 100%)',
};

let MOVIES = [];
window._initApp = function() {
  MOVIES = (window.CINEMA_DATA?.movies ?? MOCK_MOVIES).map(m => {
    const firstCinema = m.sessions?.[0]?.cinema;
    return {
      ...m,
      bg: m.bg ?? CINEMA_GRADIENTS[firstCinema] ?? 'linear-gradient(135deg,#111 0%,#1e1e1e 100%)',
      sessions: (m.sessions ?? []).map(s => ({ ...s, time: s.time.replace('*', '').trim() })),
    };
  });

// Ajusta a data inicial ao dia actual
const TODAY = new Date().toISOString().split('T')[0];

let activeView    = 'agenda';
let activeDate    = TODAY;
let activeCity    = 'lisboa';
let activeCinemas = new Set();
let filmesSort    = 'data'; // 'data' | 'rating'
let lang          = 'pt';  // 'pt' | 'en'

// Linha (por baixo do header + date-bar fixos) que define qual o dia
// "atual" para o scroll-spy. O clique num dia tem de aterrar bem dentro
// desta zona — não só "perto" — senão o scroll-spy corrige de volta para
// o dia anterior assim que a supressão termina.
const STICKY_LINE_PAD = 10;

// ── TRADUÇÕES ────────────────────────────────────────────────────────────────

const T = {
  pt: {
    pageTitle: 'sesh — sessões de cinema em Lisboa e Porto',
    navAgenda: 'Agenda', navFilmes: 'Filmes',
    cityLisboa: 'Lisboa', cityPorto: 'Porto',
    today: 'Hoje',
    noSessions: 'Sem sessões disponíveis.',
    nowShowing: 'Em exibição',
    sortNext: 'Próxima sessão',
    sortRating: '★ Rating',
    calendar: '+ Calendário',
    sessionsTitle: 'Sessões',
    sessionOne: 'sessão', sessionMany: 'sessões',
    min: 'min',
    withCompanion: 'Com acompanhamento',
    followedByDebate: 'Seguida de debate',
    specialSession: 'Sessão especial',
    days:   ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],
    months: ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],
  },
  en: {
    pageTitle: 'sesh — cinema showtimes in Lisbon and Porto',
    navAgenda: 'Schedule', navFilmes: 'Movies',
    cityLisboa: 'Lisbon', cityPorto: 'Porto',
    today: 'Today',
    noSessions: 'No showtimes available.',
    nowShowing: 'Now showing',
    sortNext: 'Next showtime',
    sortRating: '★ Rating',
    calendar: '+ Calendar',
    sessionsTitle: 'Showtimes',
    sessionOne: 'showtime', sessionMany: 'showtimes',
    min: 'min',
    withCompanion: 'With accompaniment',
    followedByDebate: 'Followed by debate',
    specialSession: 'Special screening',
    days:   ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    months: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  },
};
function t(key) { return T[lang][key]; }
// Título do filme: usa a versão inglesa (title_en, vinda do OMDB em cache)
// quando existe e estamos em EN; cai sempre para o título original.
function movieTitle(m) { return (lang === 'en' && m.title_en) ? m.title_en : m.title; }

// ── HELPERS ───────────────────────────────────────────────────────────────────

function getDates() {
  const start = new Date(TODAY + 'T00:00:00');
  return Array.from({length: 12}, (_, i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return {
      value:  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
      name:   t('days')[d.getDay()],
      num:    d.getDate(),
      month:  t('months')[d.getMonth()],
      today:  i === 0
    };
  });
}

function cinema(id) { return CINEMAS.find(c => c.id === id) || {}; }

function movieMeta(m) {
  const parts = [];
  if (m.director) parts.push(m.director);
  if (m.year)     parts.push(m.year);
  if (m.duration) parts.push(m.duration + t('min'));
  return parts.join(' · ') || '—';
}

function cinemaOk(cid) {
  const c = CINEMAS.find(x => x.id === cid);
  if (!c || c.city !== activeCity) return false;
  return activeCinemas.size === 0 || activeCinemas.has(cid);
}

function sessionCount(movie) {
  return movie.sessions.filter(s => cinemaOk(s.cinema)).length;
}

// ── RENDER DATE BAR ───────────────────────────────────────────────────────────

function renderDateBar() {
  document.getElementById('dateBar').innerHTML =
    '<div class="date-indicator" id="dateIndicator"></div>' +
    '<div class="date-dividers" id="dateDividers"></div>' +
    getDates().map(d => `
      <button class="date-chip"
              data-date="${d.value}"
              onclick="setDate('${d.value}')">
        <span class="dn">${d.name}</span>
        <span class="dd">${d.num}</span>
        <span class="dm">${d.month}</span>
      </button>
    `).join('');
  syncIndicatorToScroll();
}

function chipRect(bar, barRect, date) {
  const chip = bar.querySelector(`.date-chip[data-date="${date}"]`);
  if (!chip) return null;
  const r = chip.getBoundingClientRect();
  return { left: r.left - barRect.left, right: barRect.right - r.right };
}

// Aplica a margem direita da faixa a tudo o que depende dela: a própria
// faixa, os traços entre dias (clip inverso — só aparecem onde a faixa
// ainda não chegou) e a cor de cada número (verde se já coberto pela faixa,
// ou se for o dia selecionado — mesmo que a faixa ainda não lá tenha
// chegado, para nunca ficar sem nenhum sinal de qual é o dia atual).
function applyFill(right) {
  const bar = document.getElementById('dateBar');
  if (!bar) return;
  const barRect = bar.getBoundingClientRect();
  const fillEdge = barRect.width - right;

  document.getElementById('dateIndicator').style.clipPath = `inset(0 ${right}px 0 0px)`;
  const dividers = document.getElementById('dateDividers');
  if (dividers) dividers.style.clipPath = `inset(0 0 0 ${fillEdge}px)`;

  bar.querySelectorAll('.date-chip').forEach(chip => {
    const r = chip.getBoundingClientRect();
    const center = r.left - barRect.left + r.width / 2;
    chip.classList.toggle('filled', center <= fillEdge);
    chip.classList.toggle('current', chip.dataset.date === activeDate);
  });
}

// Sem posição de scroll para se apoiar (fora da agenda, ou agenda sem
// sessões) — preenche direto até ao chip ativo, sem interpolar.
function positionIndicatorStatic() {
  const bar = document.getElementById('dateBar');
  if (!bar) return;
  const r = chipRect(bar, bar.getBoundingClientRect(), activeDate);
  if (r) applyFill(r.right);
}

// A faixa do gradiente é uma função direta da posição de scroll — sem
// duração fixa, sem easing próprio — tal como o traço do Skiper19 segue o
// scrollYProgress. É uma barra de progresso contínua ancorada no início
// (esquerda sempre a 0): a margem direita avança enquanto lês o conteúdo
// do PRÓPRIO dia — começa onde o dia anterior ficou e completa-se
// exatamente ao chegar ao dia seguinte, nunca antes. Serve tanto o scroll
// manual como o scroll animado ao clicar numa data — os dois passam pelo
// mesmo evento 'scroll'.
let scrollSyncTicking = false;
function syncIndicatorToScroll() {
  if (activeView !== 'agenda') { positionIndicatorStatic(); return; }

  const bar = document.getElementById('dateBar');
  const days = document.querySelectorAll('.agenda-day');
  if (!bar || !days.length) { positionIndicatorStatic(); return; }

  const hdr  = document.querySelector('header');
  const line = (hdr ? hdr.offsetHeight : 0) + bar.offsetHeight + STICKY_LINE_PAD;
  const scrollY = window.scrollY;

  const triggers = Array.from(days, d => d.getBoundingClientRect().top + scrollY - line);
  let i = 0;
  while (i < days.length - 1 && scrollY >= triggers[i + 1]) i++;

  const barRect = bar.getBoundingClientRect();
  const curRect = chipRect(bar, barRect, days[i].dataset.date);
  if (!curRect) return;

  const prevRect = i > 0 ? chipRect(bar, barRect, days[i - 1].dataset.date) : null;
  const prevRight = prevRect ? prevRect.right : barRect.width; // sem anterior = nada preenchido ainda

  // último dia com sessões — não há "o dia a seguir" para marcar o fim do
  // preenchimento, por isso usa-se o fundo real da página: só fica
  // completamente cheia ao chegar ao fim do scroll possível, não ao
  // simplesmente chegar ao topo do último dia.
  const nextTrigger = i < days.length - 1
    ? triggers[i + 1]
    : document.documentElement.scrollHeight - window.innerHeight;

  const span = nextTrigger - triggers[i];
  const t = span > 0 ? Math.min(1, Math.max(0, (scrollY - triggers[i]) / span)) : 1;
  const right = prevRight + (curRect.right - prevRight) * t;

  activeDate = days[i].dataset.date;
  applyFill(right);
}
function onAgendaScroll() {
  if (scrollSyncTicking) return;
  scrollSyncTicking = true;
  requestAnimationFrame(() => {
    scrollSyncTicking = false;
    syncIndicatorToScroll();
  });
}
window.addEventListener('scroll', onAgendaScroll, { passive: true });

// ── RENDER HEADER CONTROLS (idioma + cidade) ────────────────────────────────

function renderHeaderControls() {
  document.getElementById('langToggle').innerHTML = `
    <button class="mt-opt ${lang === 'pt' ? 'active' : ''}" onclick="setLang('pt')">PT</button>
    <button class="mt-opt ${lang === 'en' ? 'active' : ''}" onclick="setLang('en')">EN</button>`;

  const cities = [
    { id: 'lisboa', name: t('cityLisboa') },
    { id: 'porto',  name: t('cityPorto')  },
  ];
  document.getElementById('cityToggle').innerHTML = cities.map(c => `
    <button class="mt-opt ${activeCity === c.id ? 'active' : ''}" onclick="setCity('${c.id}')">${c.name}</button>`).join('');

  document.querySelectorAll('#nav [data-t]').forEach(btn => {
    btn.textContent = t(btn.dataset.t);
  });
  const sessionsTitleEl = document.getElementById('modalSessionsTitle');
  if (sessionsTitleEl) sessionsTitleEl.textContent = t('sessionsTitle');
  document.title = t('pageTitle');
  document.documentElement.lang = lang;
}


// ── RENDER AGENDA ─────────────────────────────────────────────────────────────

function renderAgenda() {
  let html = '';

  for (const d of getDates()) {
    let sessions = [];
    for (const m of MOVIES) {
      for (const s of m.sessions) {
        if (s.date === d.value && cinemaOk(s.cinema))
          sessions.push({ ...s, movie: m });
      }
    }
    if (sessions.length === 0) continue;
    sessions.sort((a, b) => a.time.localeCompare(b.time));

    html += `
      <div class="agenda-day" data-date="${d.value}">
        <div class="day-header">
          <span class="dname">${d.today ? t('today') : d.name}</span>
          <span class="ddate">${d.num} ${d.month}</span>
          <span class="dcount">${sessions.length} ${sessions.length === 1 ? t('sessionOne') : t('sessionMany')}</span>
        </div>
        <div class="sessions-list">
          ${sessions.map(s => {
            const c = cinema(s.cinema);
            const thumb = s.movie.poster
              ? `<img class="sthumb" src="${s.movie.poster}" alt="" loading="lazy">`
              : `<div class="sthumb" style="background:${s.movie.bg}"></div>`;
            return `
              <div class="session-row" onclick="openModal('${s.movie.id}')">
                <span class="stime">${s.time}</span>
                ${thumb}
                <div class="smovie">
                  <span class="stitle">${movieTitle(s.movie)}</span>
                  <span class="smeta">${s.movie.director ?? ''}${s.movie.year ? ' · ' + s.movie.year : ''}${s.movie.duration ? ' · ' + s.movie.duration + t('min') : ''}</span>
                  ${(() => {
                    const tags = [];
                    if (s.movie.festival) tags.push(`<span class="special-tag">${s.movie.festival}</span>`);
                    (s.labels ?? []).forEach(l => tags.push(`<span class="special-tag">${simplifyLabel(l)}</span>`));
                    return tags.length ? `<div class="session-labels">${tags.join('')}</div>` : '';
                  })()}
                </div>
                <div class="scinema" style="color:${c.color}">${c.short}</div>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  document.getElementById('main').innerHTML = html || `<div class="empty">${t('noSessions')}</div>`;
}

// ── RENDER FILMES ─────────────────────────────────────────────────────────────

function nextSession(movie) {
  // Data+hora da próxima sessão futura
  const now = TODAY;
  const future = movie.sessions
    .filter(s => cinemaOk(s.cinema) && s.date >= now)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  return future[0] ?? null;
}

function renderFilmes() {
  let movies = MOVIES.filter(m => sessionCount(m) > 0);

  if (filmesSort === 'rating') {
    movies = [...movies].sort((a, b) => (b.rating ?? 0) - (a.rating ?? 0));
  } else {
    // Ordena pela próxima sessão mais próxima
    movies = [...movies].sort((a, b) => {
      const sa = nextSession(a), sb = nextSession(b);
      if (!sa && !sb) return 0;
      if (!sa) return 1;
      if (!sb) return -1;
      return (sa.date + sa.time).localeCompare(sb.date + sb.time);
    });
  }

  document.getElementById('main').style.padding = '';
  document.getElementById('main').innerHTML = `
    <div class="films-header">
      <span class="films-header-title">${t('nowShowing')}</span>
      <div class="films-sort">
        <button class="sort-btn ${filmesSort === 'data'   ? 'active' : ''}" onclick="setSort('data')">${t('sortNext')}</button>
        <button class="sort-btn ${filmesSort === 'rating' ? 'active' : ''}" onclick="setSort('rating')">${t('sortRating')}</button>
      </div>
    </div>
    <div class="movies-grid">
      ${movies.map(m => `
        <div class="movie-card" onclick="openModal('${m.id}')">
          <div class="movie-poster">
            <div class="poster-bg" style="${m.poster
              ? `background:url('${m.poster}') center/cover no-repeat`
              : `background:${m.bg}`}">
              ${m.poster ? '' : `<div class="poster-overlay"></div><span class="poster-title">${movieTitle(m)}</span>`}
            </div>
            ${m.rating ? `<span class="poster-rating">★ ${m.rating.toFixed(1)}</span>` : ''}
          </div>
          <div class="movie-foot">
            <div class="film-foot-title">${movieTitle(m)}</div>
            ${m.director ? `<div class="film-foot-dir">${m.director}</div>` : ''}
            <div class="genres">
              ${m.festival ? `<span class="special-tag">${m.festival}</span>` : ''}
              ${(m.genres ?? []).slice(0,2).map(g => `<span class="genre-tag">${g}</span>`).join('')}
            </div>
          </div>
        </div>`).join('')}
    </div>`;
}

// ── MODAL ─────────────────────────────────────────────────────────────────────

function normTitle(str) {
  return (str || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
}

function openModal(id) {
  const m = MOVIES.find(x => String(x.id) === String(id));
  if (!m) return;

  // Poster
  const posterEl = document.getElementById('modalPoster');
  if (m.poster) {
    posterEl.innerHTML = `<img src="${m.poster}" alt="${movieTitle(m)}">`;
  } else {
    posterEl.innerHTML = `<div class="modal-poster-fallback" style="background:${m.bg}"></div>`;
  }

  // Título e meta
  document.getElementById('modalTitle').textContent = movieTitle(m);
  document.getElementById('modalMeta').textContent = movieMeta(m);

  // País + Géneros + Rating + Festival (badges em linha)
  const country = m.country ? m.country.split(',')[0].trim() : null;
  const genres  = (m.genres ?? []).slice(0, 3);
  document.getElementById('modalGenres').innerHTML =
    (m.festival ? `<span class="modal-special-tag">${m.festival}</span>` : '') +
    (country ? `<span class="modal-country-tag">${country}</span>` : '') +
    genres.map(g => `<span class="genre-tag">${g}</span>`).join('') +
    (m.rating ? `<span class="rating-tag">★ ${m.rating.toFixed(1)}</span>` : '');

  // Descrição
  const plotEl = document.getElementById('modalPlot');
  plotEl.textContent = m.plot ?? '';
  plotEl.style.display = m.plot ? '' : 'none';

  // Sessões — agrega todas as entradas com o mesmo título normalizado
  const mNorm = normTitle(m.title);
  const allSessions = MOVIES
    .filter(x => normTitle(x.title) === mNorm)
    .flatMap(x => x.sessions);
  const seen = new Set();
  const sessions = allSessions
    .filter(s => {
      const k = s.date + s.time + s.cinema;
      if (seen.has(k)) return false;
      seen.add(k);
      return s.date >= TODAY;
    })
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  document.getElementById('modalSessionsList').innerHTML = sessions.map(s => {
    const d = new Date(s.date + 'T00:00:00');
    const label = s.date === TODAY
      ? t('today')
      : `${t('days')[d.getDay()]} ${d.getDate()} ${t('months')[d.getMonth()]}`;
    const c = cinema(s.cinema);
    const esc = v => JSON.stringify(String(v ?? '')).replace(/"/g, '&quot;');
    const calArgs = [esc(movieTitle(m)), esc(s.date), esc(s.time), m.duration||120, esc(c.name??s.cinema), esc(c.address??'')].join(',');
    const slabels = (s.labels ?? []).map(l => `<span class="modal-slabel">${l}</span>`).join('');
    return `
      <div class="modal-session-row">
        <span class="modal-sdate">${label}</span>
        <span class="modal-stime">${s.time}</span>
        <div class="modal-sinfo">
          <span class="modal-scinema" style="color:${c.color ?? '#888'}">${c.name ?? s.cinema}</span>
          ${slabels}
        </div>
        <button class="modal-cal-btn" onclick="addToCalendar(${calArgs})">${t('calendar')}</button>
      </div>`;
  }).join('');

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function addToCalendar(title, date, time, durationMin, cinemaName, cinemaAddress) {
  const [h, m] = time.split(':').map(Number);
  const dur = durationMin || 120;
  const pad = n => String(n).padStart(2, '0');

  const startDate = new Date(date + 'T' + pad(h) + ':' + pad(m) + ':00');
  const endDate   = new Date(startDate.getTime() + dur * 60000);

  const fmt = d =>
    `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

  const uid = `${date}-${time.replace(':','')}-${Math.random().toString(36).slice(2)}`;
  const location = cinemaAddress ? `${cinemaName}\\, ${cinemaAddress}` : cinemaName;

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//cinemas//PT',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART:${fmt(startDate)}`,
    `DTEND:${fmt(endDate)}`,
    `SUMMARY:${title}`,
    `LOCATION:${location}`,
    'END:VEVENT',
    'END:VCALENDAR',
  ].join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── DISPATCH ──────────────────────────────────────────────────────────────────

function render() {
  // o display tem de ser acertado antes de renderDateBar() medir a barra —
  // um elemento display:none devolve um getBoundingClientRect() todo a
  // zero, o que parte o cálculo do clip-path da faixa do gradiente.
  document.getElementById('dateBar').style.display = activeView === 'agenda' ? 'flex' : 'none';

  renderHeaderControls();
  // altura do header calculada, não fixa — no mobile o header pode
  // quebrar para 2 linhas (idioma/cidade), o que muda a sua altura real.
  document.getElementById('dateBar').style.top = document.querySelector('header').offsetHeight + 'px';

  renderDateBar();

  document.getElementById('main').style.padding = '';

  if (activeView === 'agenda')  renderAgenda();
  if (activeView === 'filmes')  renderFilmes();

  // renderDateBar() já correu (mede a faixa), mas renderAgenda() só criou os
  // .agenda-day agora — sem isto a faixa ficava presa na posição estática
  // (dia atual já 100% cheio) até ao primeiro scroll do utilizador.
  if (activeView === 'agenda') syncIndicatorToScroll();

  document.querySelectorAll('nav button').forEach((btn, i) => {
    btn.classList.toggle('active', ['agenda','filmes'][i] === activeView);
  });
}

function simplifyLabel(l) {
  if (l.length <= 38) return l;
  if (/^com acompanhamento/i.test(l))        return t('withCompanion');
  if (/^sessão com acompanhamento/i.test(l)) return t('withCompanion');
  // "com a presença de X" vem do texto original scraped (em PT) — o nome
  // próprio não é traduzível, por isso mantém-se tal como está mesmo em EN.
  const m = l.match(/^(com a presen[çc]a d[eo]\s+\S+)/i);
  if (m) return m[1];
  if (/^seguida de debate/i.test(l))   return t('followedByDebate');
  if (/^conversa com\b/i.test(l))      return l.slice(0, 35).trimEnd() + '…';
  if (/^sess[ãa]o com\b/i.test(l))     return l.slice(0, 35).trimEnd() + '…';
  return t('specialSession');
}
function setView(v) {
  activeView = v;
  render();
}
// Duração fixa independente da distância — um salto do dia 4 para o dia 15
// não pode demorar mais do que ir para o dia 5 (o scroll nativo "smooth" do
// browser escala com a distância, o que fica lento demais em listas longas).
// A faixa do gradiente não precisa de ser avisada disto: syncIndicatorToScroll
// corre a cada frame deste scroll (é só mais um 'scroll' event) e vai
// interpolando sozinha por todos os dias pelo meio, até ao dia final.
function animateScrollTo(targetY, duration = 550) {
  const startY = window.scrollY;
  const delta = targetY - startY;
  if (Math.abs(delta) < 2) return;
  const startTime = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3); // easeOutCubic
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    window.scrollTo({ top: startY + delta * ease(t), left: 0, behavior: 'instant' });
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function setDate(d) {
  activeView = 'agenda';
  render();
  requestAnimationFrame(() => {
    const el = document.querySelector(`.agenda-day[data-date="${d}"]`);
    if (!el) {
      // sem sessões nesse dia — não há para onde fazer scroll, mostra já selecionado
      activeDate = d;
      positionIndicatorStatic();
      return;
    }
    const hdr = document.querySelector('header');
    const dbar = document.querySelector('.date-bar');
    const stickyH = (hdr ? hdr.offsetHeight : 0) + (dbar ? dbar.offsetHeight : 0);
    // aterra bem dentro da zona "ativa" (STICKY_LINE_PAD), não só perto dela
    animateScrollTo(el.offsetTop - stickyH - (STICKY_LINE_PAD - 4));
  });
}
function setSort(s)  { filmesSort = s; renderFilmes(); }
function setCity(city) {
  activeCity = city;
  activeCinemas = new Set();
  render();
}
function setLang(l) {
  if (l === lang) return;
  lang = l;
  render();
}

// Expõe funções chamadas por onclick no HTML estático e nos templates gerados
window.openModal         = openModal;
window.closeModal        = closeModal;
window.handleOverlayClick = handleOverlayClick;
window.setView           = setView;
window.setDate           = setDate;
window.setCity           = setCity;
window.setLang           = setLang;
window.setSort           = setSort;
window.addToCalendar     = addToCalendar;

render();
}; // fim _initApp
</script>
</body>
</html>
