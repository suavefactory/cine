name: Atualizar sessões

on:
  schedule:
    - cron: '0 8 * * *'    # 08:00 UTC = 09:00 Lisboa (verão) — corrida principal, scraper completo
    - cron: '10 8 * * *'   # 08:10 UTC — só reprocessa o enriquecimento (filmes ainda sem rating)
    - cron: '20 8 * * *'   # 08:20 UTC — 2ª tentativa igual, para apanhar falhas transitórias
  workflow_dispatch:        # permite correr manualmente no GitHub (corre sempre o scraper completo)

# As três corridas da manhã estão a 10 minutos umas das outras, mas um backfill
# grande demora bem mais do que isso. Sem isto, a 2ª e a 3ª arrancavam com a 1ª
# ainda a meio, refaziam o mesmo trabalho e colidiam no push.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr scraper completo (sessões + enriquecimento)
        if: github.event.schedule != '10 8 * * *' && github.event.schedule != '20 8 * * *'
        run: python3 scrapers/run.py

      - name: Tentar de novo só o enriquecimento (filmes ainda sem rating)
        if: github.event.schedule == '10 8 * * *' || github.event.schedule == '20 8 * * *'
        run: python3 scrapers/enricher.py

      - name: Commit e push se houver alterações
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sessions.js data/omdb_cache.json data/wiki_director_cache.json data/filmography_cache.json
          git diff --cached --quiet && { echo "Nada para publicar."; exit 0; }
          git commit -m "chore: atualizar sessões $(date -u '+%Y-%m-%d %H:%M')"
          # O push pode ser rejeitado se algo tiver entrado no main entretanto
          # (um commit manual, outra corrida). Os ficheiros de dados são
          # regenerados por inteiro a cada corrida, por isso em conflito fica
          # sempre a versão desta corrida, que é a mais recente.
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejeitado — a integrar o remoto (tentativa $i)."
            git pull --rebase --strategy-option=theirs origin main || { git rebase --abort || true; exit 1; }
          done
          echo "Não foi possível publicar após 3 tentativas."
          exit 1
